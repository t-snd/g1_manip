[project]
name = "g1-manip"
version = "0.1.0"
description = "Unitree G1 (upper body) tabletop pick-and-place with MuJoCo + mink + ACT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.15.0",
    "mink==1.3.0",
    "daqp==0.10.3",
    "quadprog==0.1.13",
    "numpy==2.2.6",
    "lerobot[dataset,training]==0.6.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["g1_manip"]
